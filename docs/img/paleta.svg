<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="1200" height="400" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="800" fill="#1F1F1F">Paleta de colores</text>
  <g font-size="14">
    <rect x="40" y="70" width="260" height="150" rx="10" fill="#E50914"/>
    <text x="56" y="196" fill="#FFFFFF" font-weight="800" font-size="20">#E50914</text>
    <text x="40" y="246" font-weight="700" fill="#1F1F1F">Rojo Netflix</text>
    <text x="40" y="266" fill="#555">Películas · KPI principal · líder</text>

    <rect x="320" y="70" width="260" height="150" rx="10" fill="#3B82F6"/>
    <text x="336" y="196" fill="#FFFFFF" font-weight="800" font-size="20">#3B82F6</text>
    <text x="320" y="246" font-weight="700" fill="#1F1F1F">Azul</text>
    <text x="320" y="266" fill="#555">Series</text>

    <rect x="600" y="70" width="260" height="150" rx="10" fill="#141414"/>
    <text x="616" y="196" fill="#E5E5E5" font-weight="800" font-size="20">#141414</text>
    <text x="600" y="246" font-weight="700" fill="#1F1F1F">Negro</text>
    <text x="600" y="266" fill="#555">Fondo (como la app de Netflix)</text>

    <rect x="880" y="70" width="260" height="150" rx="10" fill="#E5E5E5" stroke="#CCC"/>
    <text x="896" y="196" fill="#141414" font-weight="800" font-size="20">#E5E5E5</text>
    <text x="880" y="246" font-weight="700" fill="#1F1F1F">Gris claro</text>
    <text x="880" y="266" fill="#555">Texto · barras secundarias (gris medio)</text>
  </g>
  <text x="40" y="318" font-size="14" font-weight="700" fill="#1F1F1F">Escala del mapa de calor (menos → más títulos)</text>
  <g>
    <rect x="40" y="332" width="120" height="34" fill="#2A2A2A"/><rect x="160" y="332" width="120" height="34" fill="#4A1316"/>
    <rect x="280" y="332" width="120" height="34" fill="#7A1419"/><rect x="400" y="332" width="120" height="34" fill="#A8111A"/>
    <rect x="520" y="332" width="120" height="34" fill="#E50914"/><rect x="640" y="332" width="120" height="34" fill="#FF6B6F"/>
    <g font-size="12" fill="#FFFFFF" text-anchor="middle"><text x="100" y="354">0</text><text x="220" y="354">1–9</text><text x="340" y="354">10–49</text><text x="460" y="354">50–199</text><text x="580" y="354">200–999</text><text x="700" y="354" fill="#141414">1000+</text></g>
  </g>
  <text x="790" y="346" font-size="13" fill="#555">Rojo vs azul: se distinguen también con daltonismo</text>
  <text x="790" y="366" font-size="13" fill="#555">(no se usa la combinación rojo-verde).</text>
</svg>
